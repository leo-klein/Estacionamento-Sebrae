<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Entrada</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 34 34%22><rect width=%2234%22 height=%2234%22 rx=%228%22 fill=%22%232563eb%22/><text x=%2250%25%22 y=%2254%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Plus Jakarta Sans, sans-serif%22 font-size=%2220%22 font-weight=%22800%22>P</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --bg-dark: #060810;
      --card-bg: rgba(12, 16, 30, 0.88);
      --border-color: rgba(148, 163, 184, 0.10);
      --text-main: #eef2f7;
      --text-muted: #929bad;
      --success: #34d399;
      --danger: #f87171;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      color: var(--text-main);
      position: relative;
      background-image:
              radial-gradient(ellipse at 12% 8%, rgba(37, 99, 235, 0.12), transparent 42%),
              radial-gradient(ellipse at 88% 92%, rgba(16, 185, 129, 0.045), transparent 38%),
              linear-gradient(135deg, #070913 0%, #030408 100%);
      background-attachment: fixed;
      overflow-y: auto;
    }

    .bg-shapes {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .shape {
      position: absolute;
      filter: blur(70px);
      opacity: 0.06;
      border-radius: 50%;
    }

    .shape-1 {
      width: 350px;
      height: 350px;
      background: #3b82f6;
      top: -100px;
      left: -100px;
    }

    .shape-2 {
      width: 450px;
      height: 450px;
      background: #2563eb;
      bottom: -150px;
      right: -100px;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      background: rgba(9, 12, 24, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      box-shadow: 0 5px 18px rgba(37, 99, 235, 0.28);
    }

    .brand-text {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .brand-text span {
      color: #60a5fa;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-link {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: background .22s ease, color .22s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.055);
    }

    .nav-link.active {
      background: rgba(96, 165, 250, 0.10);
      color: #dbeafe;
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.08);
    }

    .btn-logout {
      padding: 8px 16px;
      background: rgba(248, 113, 113, 0.075);
      border: 1px solid rgba(248, 113, 113, 0.16);
      color: var(--danger);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all .22s ease;
      margin-left: 10px;
    }

    .btn-logout:hover {
      background: rgba(248, 113, 113, 0.14);
      border-color: rgba(248, 113, 113, 0.28);
    }

    .container {
      max-width: 800px;
      margin: 36px auto;
      padding: 0 24px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 40px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
    }

    .form-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      letter-spacing: -0.01em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.05);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      max-height: 180px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 28px;
    }

    .btn {
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-salvar {
      background: rgba(6, 78, 59, 0.4);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: #6ee7b7;
    }
    .btn-salvar:hover {
      background: rgba(6, 78, 59, 0.65);
      border-color: rgba(52, 211, 153, 0.45);
      color: #34d399;
    }

    .btn-cancelar {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }
    .btn-cancelar:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
</div>

<div class="app-wrapper">
  <header class="navbar">
    <div class="brand-header">
      <div class="brand-icon">P</div>
      <div class="brand-text">Estacionamento <span>Sebrae</span></div>
    </div>
    <nav class="nav-links">
      <a th:href="@{/painel}" class="nav-link">Painel</a>
      <a th:href="@{/movimentacoes}" class="nav-link">Movimentações</a>
      <a th:href="@{/relatorios}" class="nav-link">Relatórios</a>
      <a th:href="@{/}" class="btn-logout">Sair</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-card">
      <h1 class="form-title">Registrar Entrada de Veículo</h1>

      <form th:action="@{/veiculos/salvar}" method="post">
        <div class="form-group">
          <label>Placa (Formato Antigo ou Mercosul)</label>
          <input type="text" id="placa" name="placa"
                 placeholder="Ex: ABC-1234 ou ABC1D23"
                 pattern="[A-Z]{3}[0-9][A-Z0-9][0-9]{2}|[A-Z]{3}-[0-9]{4}"
                 title="Digite uma placa válida no formato ABC-1234 ou ABC1D23"
                 style="text-transform: uppercase;"
                 maxlength="8" required>
        </div>

        <div class="form-group">
          <label>Modelo</label>
          <input type="text" name="modelo" placeholder="Digite o modelo do veículo" required>
        </div>

        <div class="form-group">
          <label>Cor</label>
          <input type="text" name="cor" placeholder="Digite a cor" required>
        </div>

        <div class="form-group">
          <label>Observações</label>
          <textarea name="observacoes" placeholder="Informações adicionais (opcional)"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-salvar">Salvar Entrada</button>
          <a th:href="@{/painel}" class="btn btn-cancelar">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script>
  document.getElementById('placa').addEventListener('input', function (e) {
    this.value = this.value.toUpperCase();
  });
</script>

</body>
</html>
