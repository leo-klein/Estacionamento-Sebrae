<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Saída</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 34 34%22><rect width=%2234%22 height=%2234%22 rx=%228%22 fill=%22%232563eb%22/><text x=%2250%25%22 y=%2254%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Plus Jakarta Sans, sans-serif%22 font-size=%2220%22 font-weight=%22800%22>P</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --bg-dark: #060810;
      --card-bg: rgba(12, 16, 30, 0.88);
      --border-color: rgba(148, 163, 184, 0.10);
      --text-main: #eef2f7;
      --text-muted: #929bad;
      --success: #34d399;
      --danger: #f87171;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      color: var(--text-main);
      position: relative;
      background-image:
              radial-gradient(ellipse at 12% 8%, rgba(37, 99, 235, 0.12), transparent 42%),
              radial-gradient(ellipse at 88% 92%, rgba(16, 185, 129, 0.045), transparent 38%),
              linear-gradient(135deg, #070913 0%, #030408 100%);
      background-attachment: fixed;
      overflow-y: auto;
    }

    .bg-shapes {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .shape {
      position: absolute;
      filter: blur(70px);
      opacity: 0.06;
      border-radius: 50%;
    }

    .shape-1 {
      width: 350px;
      height: 350px;
      background: #3b82f6;
      top: -100px;
      left: -100px;
    }

    .shape-2 {
      width: 450px;
      height: 450px;
      background: #2563eb;
      bottom: -150px;
      right: -100px;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      background: rgba(9, 12, 24, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      box-shadow: 0 5px 18px rgba(37, 99, 235, 0.28);
    }

    .brand-text {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .brand-text span {
      color: #60a5fa;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-link {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: background .22s ease, color .22s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.055);
    }

    .nav-link.active {
      background: rgba(96, 165, 250, 0.10);
      color: #dbeafe;
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.08);
    }

    .btn-logout {
      padding: 8px 16px;
      background: rgba(248, 113, 113, 0.075);
      border: 1px solid rgba(248, 113, 113, 0.16);
      color: var(--danger);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all .22s ease;
      margin-left: 10px;
    }

    .btn-logout:hover {
      background: rgba(248, 113, 113, 0.14);
      border-color: rgba(248, 113, 113, 0.28);
    }

    .container {
      max-width: 800px;
      margin: 36px auto;
      padding: 0 24px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 40px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
    }

    .card-header-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .card-header-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .vehicle-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .vehicle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .vehicle-item:last-child {
      border-bottom: none;
    }

    .vehicle-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .vehicle-main-info {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .vehicle-main-info span {
      font-weight: 700;
      color: #f8fafc;
    }

    .vehicle-sub-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .vehicle-tempo {
      color: #fbbf64;
      font-weight: 600;
      margin-left: 4px;
    }

    .btn-saida-acao {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      display: inline-block;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.1);
    }

    .btn-saida-acao:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fde68a;
      transform: translateY(-1px);
    }

    .action-footer {
      margin-top: 32px;
      display: flex;
      justify-content: flex-start;
    }

    .btn-cancelar {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-cancelar:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
</div>

<div class="app-wrapper">
  <header class="navbar">
    <div class="brand-header">
      <div class="brand-icon">P</div>
      <div class="brand-text">Estacionamento <span>Sebrae</span></div>
    </div>
    <nav class="nav-links">
      <a th:href="@{/painel}" class="nav-link">Painel</a>
      <a th:href="@{/movimentacoes}" class="nav-link">Movimentações</a>
      <a th:href="@{/relatorios}" class="nav-link">Relatórios</a>
      <a th:href="@{/logout}" class="btn-logout">Sair</a>
    </nav>
  </header>

  <main class="container">
    <div class="content-card">
      <h2 class="card-header-title">Registrar Saída de Veículo</h2>
      <p class="card-header-subtitle">Selecione o veículo que está deixando o estacionamento.</p>

      <div class="vehicle-list">
        <div class="vehicle-item" th:each="v : ${veiculosEstacionados}">
          <div class="vehicle-info">
            <div class="vehicle-main-info">
              <span th:text="${v.placa}">ABC-1234</span> — <span th:text="${v.modelo}">Gol</span>
            </div>
            <div class="vehicle-sub-info">
              Entrada: <span class="horario-entrada" th:text="${v.dataEntrada}">2026-10-01T16:59:00</span>
              <span class="vehicle-tempo">(calculando...)</span>
            </div>
          </div>
          <div>
            <a th:href="@{/registrar-saida(id=${v.id})}" class="btn-saida-acao">Confirmar Saída</a>
          </div>
        </div>
      </div>

      <div class="action-footer">
        <a th:href="@{/painel}" class="btn-cancelar">Cancelar</a>
      </div>
    </div>
  </main>
</div>

<script>
  document.querySelectorAll('.vehicle-item').forEach(item => {
    const spanEntrada = item.querySelector('.horario-entrada');
    const spanTempo = item.querySelector('.vehicle-tempo');

    if (spanEntrada && spanTempo) {
      const dataEntradaStr = spanEntrada.textContent.trim();
      const dataEntrada = new Date(dataEntradaStr);

      let entradaTime = dataEntrada.getTime();
      if (isNaN(entradaTime)) {
        const partes = dataEntradaStr.split(':');
        if (partes.length >= 2) {
          const agora = new Date();
          agora.setHours(parseInt(partes[0], 10), parseInt(partes[1], 10), 0, 0);
          entradaTime = agora.getTime();
        }
      }

      if (!isNaN(entradaTime)) {
        const agora = new Date().getTime();
        const diffMs = agora - entradaTime;
        const diffMins = Math.floor(diffMs / (1000 * 60));

        if (diffMins < 0) {
          spanTempo.textContent = '(agora mesmo)';
        } else if (diffMins < 60) {
          spanTempo.textContent = `(há ${diffMins} min)`;
        } else {
          const horas = Math.floor(diffMins / 60);
          const mins = diffMins % 60;
          spanTempo.textContent = `(há ${horas}h ${mins}min)`;
        }

        const dObj = new Date(entradaTime);
        spanEntrada.textContent = dObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } else {
        spanTempo.textContent = '';
      }
    }
  });
</script>

</body>
</html>
